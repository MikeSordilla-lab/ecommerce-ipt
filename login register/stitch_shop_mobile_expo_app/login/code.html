<style>

<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary">
<!-- 
      Transactional Context: Navigation Shells (TopAppBar, BottomNavBar) are suppressed 
      per the Semantic Shell Mandate for login/auth flows to prioritize the canvas.
    -->
<main class="flex-1 flex flex-col justify-center px-margin-mobile py-xl w-full max-w-[480px] mx-auto relative z-10">
<!-- Ambient Background Glow (Optional subtle texture) -->
<div class="absolute inset-0 pointer-events-none overflow-hidden -z-10 flex justify-center items-start">
<div class="w-[300px] h-[300px] bg-primary-container opacity-[0.03] rounded-full blur-3xl -top-[100px]"></div>
</div>
<!-- Header Section -->
<header class="mb-xl text-center flex flex-col items-center">
<!-- Brand Mark -->
<div class="w-[64px] h-[64px] rounded-full bg-surface-container-low flex items-center justify-center mb-lg shadow-[0_4px_12px_rgba(23,23,23,0.03)] border border-surface-container-high">
<span class="material-symbols-outlined text-[32px] text-primary-container" style="font-variation-settings: 'FILL' 1;">
                    storefront
                </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm tracking-tight">
                Welcome back
            </h1>
<p class="font-body-lg text-body-lg text-secondary">
                Sign in to continue to Shop
            </p>
</header>
<!-- Form Section -->
<form action="#" class="flex flex-col gap-lg" method="POST">
<!-- Username Input -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-label px-micro" for="username">
                    Username
                </label>
<div class="relative input-glow transition-shadow duration-300 rounded">
<input autocomplete="username" class="w-full bg-surface-container-lowest border border-border rounded px-md py-[14px] font-body-md text-body-md text-on-surface placeholder-outline-variant focus:outline-none focus:border-primary-container transition-colors shadow-[0_2px_8px_rgba(23,23,23,0.02)]" id="username" name="username" placeholder="Enter your username" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center px-micro">
<label class="font-label-md text-label-md text-label" for="password">
                        Password
                    </label>
<a class="font-label-sm text-label-sm text-primary-container hover:text-primary transition-colors" href="#">
                        Forgot password?
                    </a>
</div>
<div class="relative input-glow transition-shadow duration-300 rounded">
<input autocomplete="current-password" class="w-full bg-surface-container-lowest border border-border rounded px-md py-[14px] font-body-md text-body-md text-on-surface placeholder-outline-variant focus:outline-none focus:border-primary-container transition-colors shadow-[0_2px_8px_rgba(23,23,23,0.02)]" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Action -->
<button class="mt-sm w-full bg-primary-container text-on-primary rounded py-[16px] font-label-md text-label-md flex justify-center items-center gap-sm hover:bg-primary hover:shadow-[rgba(50,50,93,0.25)_0px_30px_45px_-30px,rgba(0,0,0,0.1)_0px_18px_36px_-18px] transition-all duration-300 active:scale-[0.98] shadow-[rgba(23,23,23,0.08)_0px_15px_35px]" type="button">
                Sign In
            </button>
</form>
<!-- Footer Section -->
<footer class="mt-xl text-center">
<p class="font-body-md text-body-md text-secondary">
                Don't have an account? 
                <a class="text-primary-container font-label-md text-label-md hover:underline underline-offset-4 decoration-primary-container/30 transition-all" href="#">
                    Create an account
                </a>
</p>
</footer>
</main>
