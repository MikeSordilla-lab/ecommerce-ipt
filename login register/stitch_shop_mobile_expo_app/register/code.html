<body class="bg-surface-bright min-h-screen flex flex-col font-body-md text-on-surface antialiased selection:bg-primary-fixed-dim selection:text-on-primary-fixed">
<!-- Minimal Header for Transactional Flow -->
<header class="flex items-center px-margin-mobile py-md w-full">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</header>
<main class="flex-1 w-full max-w-md mx-auto px-margin-mobile flex flex-col pb-xl">
<div class="mt-md mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm">Create Account</h1>
<p class="font-body-md text-body-md text-secondary">Join the Shop ecosystem today.</p>
</div>
<!-- Registration Form Card -->
<form class="bg-background rounded-lg border border-border shadow-[0px_15px_35px_rgba(23,23,23,0.08)] p-md flex flex-col gap-lg">
<!-- Username Input -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-label" for="username">Username</label>
<input class="w-full h-12 px-sm border border-border rounded bg-background font-body-md text-label outline-none transition-all focus:border-primary-container focus:ring-1 focus:ring-primary-container placeholder:text-outline-variant" id="username" name="username" placeholder="Enter your username" required="" type="text"/>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-label" for="email">Email Address</label>
<input class="w-full h-12 px-sm border border-border rounded bg-background font-body-md text-label outline-none transition-all focus:border-primary-container focus:ring-1 focus:ring-primary-container placeholder:text-outline-variant" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-label" for="password">Password</label>
<div class="relative">
<input class="w-full h-12 pl-sm pr-10 border border-border rounded bg-background font-body-md text-label outline-none transition-all focus:border-primary-container focus:ring-1 focus:ring-primary-container placeholder:text-outline-variant" id="password" name="password" placeholder="Create a secure password" required="" type="password"/>
<button class="absolute right-0 top-0 h-12 w-12 flex items-center justify-center text-secondary hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Role Selector (Bento Grid Style) -->
<div class="flex flex-col gap-sm mt-sm">
<label class="font-label-md text-label-md text-label">Account Role</label>
<p class="font-label-sm text-label-sm text-secondary mb-micro">Choose a customer account for shopping or a seller account for managing products.</p>
<div class="grid grid-cols-2 gap-sm">
<!-- Customer Option -->
<label class="relative flex flex-col items-start p-sm rounded border border-border bg-surface-bright cursor-pointer transition-all hover:border-outline-variant has-[:checked]:border-primary-container has-[:checked]:bg-surface-container-low has-[:checked]:shadow-[0_0_0_1px_#533afd]">
<input checked="" class="peer sr-only" name="role" type="radio" value="customer"/>
<span class="material-symbols-outlined mb-sm text-secondary peer-checked:text-primary-container" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
<span class="font-label-md text-label-md text-on-surface peer-checked:text-primary-container">Customer</span>
</label>
<!-- Seller Option -->
<label class="relative flex flex-col items-start p-sm rounded border border-border bg-surface-bright cursor-pointer transition-all hover:border-outline-variant has-[:checked]:border-primary-container has-[:checked]:bg-surface-container-low has-[:checked]:shadow-[0_0_0_1px_#533afd]">
<input class="peer sr-only" name="role" type="radio" value="seller"/>
<span class="material-symbols-outlined mb-sm text-secondary peer-checked:text-primary-container">storefront</span>
<span class="font-label-md text-label-md text-on-surface peer-checked:text-primary-container">Seller</span>
</label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-12 mt-md bg-primary-container text-on-primary font-body-md text-body-md rounded flex items-center justify-center gap-sm transition-opacity hover:opacity-90 active:scale-[0.98]" type="submit">
<span>Register</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-lg text-center font-label-md text-label-md text-secondary">
            Already have an account? 
            <a class="text-primary-container hover:text-primary transition-colors" href="#">Log in</a>
</div>
</main>
</body></html>
